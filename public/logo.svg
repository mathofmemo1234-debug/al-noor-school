<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344"/>
      <stop offset="50%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Circle Frame -->
  <circle cx="250" cy="250" r="236" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8"/>
  <circle cx="250" cy="250" r="220" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>

  <!-- Radiant Light Rays (شمس النور) -->
  <g opacity="0.25">
    <line x1="250" y1="50" x2="250" y2="90" stroke="#fed7aa" stroke-width="6" stroke-linecap="round"/>
    <line x1="250" y1="410" x2="250" y2="450" stroke="#fed7aa" stroke-width="6" stroke-linecap="round"/>
    <line x1="50" y1="250" x2="90" y2="250" stroke="#fed7aa" stroke-width="6" stroke-linecap="round"/>
    <line x1="410" y1="250" x2="450" y2="250" stroke="#fed7aa" stroke-width="6" stroke-linecap="round"/>
    <line x1="108" y1="108" x2="138" y2="138" stroke="#fed7aa" stroke-width="5" stroke-linecap="round"/>
    <line x1="362" y1="362" x2="392" y2="392" stroke="#fed7aa" stroke-width="5" stroke-linecap="round"/>
    <line x1="362" y1="108" x2="392" y2="138" stroke="#fed7aa" stroke-width="5" stroke-linecap="round"/>
    <line x1="108" y1="362" x2="138" y2="392" stroke="#fed7aa" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Glowing Beacon / Sun of Enlightenment -->
  <circle cx="250" cy="180" r="48" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="250" cy="180" r="38" fill="#ffffff" opacity="0.9"/>
  <circle cx="250" cy="180" r="24" fill="#fbbf24"/>

  <!-- Stylized Smart Knowledge Book (الكتاب والتعلم الذكي) -->
  <path d="M250 255 L160 220 C130 208 120 230 120 245 L120 330 C120 340 130 350 160 360 L250 390 L340 360 C370 350 380 340 380 330 L380 245 C380 230 370 208 340 220 Z" 
        fill="#082f49" stroke="url(#cyanGrad)" stroke-width="4"/>
  
  <!-- Left Page -->
  <path d="M250 260 C210 235 155 240 135 255 L135 340 C155 325 210 320 250 345 Z" 
        fill="url(#cyanGrad)" opacity="0.9"/>
  <!-- Right Page -->
  <path d="M250 260 C290 235 345 240 365 255 L365 340 C345 325 290 320 250 345 Z" 
        fill="url(#cyanGrad)" opacity="0.9"/>
  
  <!-- Book Spine Center Line -->
  <line x1="250" y1="250" x2="250" y2="385" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>

  <!-- Academic Torch Rays Ascending -->
  <path d="M240 225 Q250 195 250 180 Q250 195 260 225 Z" fill="url(#goldGrad)"/>

  <!-- Upper Banner Text Arc (مدارس النور الأهلية) -->
  <text x="250" y="85" text-anchor="middle" fill="#ffffff" font-family="Cairo, Arial, sans-serif" font-weight="800" font-size="28" letter-spacing="2">
    مَدَارِسُ النُّورِ الأَهْلِيَّة
  </text>
  
  <!-- Subtitle Text (للتعلم الذكي) -->
  <text x="250" y="115" text-anchor="middle" fill="#38bdf8" font-family="Cairo, Arial, sans-serif" font-weight="700" font-size="16" letter-spacing="4">
    لِلتَّعَلُّمِ الذَّكِيّ
  </text>

  <!-- Lower Banner Text (AL-NOOR SCHOOLS) -->
  <text x="250" y="432" text-anchor="middle" fill="#facc15" font-family="Arial, sans-serif" font-weight="800" font-size="19" letter-spacing="5">
    AL-NOOR SCHOOLS
  </text>
  
  <!-- 3 Stars -->
  <g fill="#fbbf24">
    <polygon points="250,450 253,458 261,458 255,463 257,471 250,466 243,471 245,463 239,458 247,458"/>
    <polygon points="215,448 217,454 223,454 218,458 220,464 215,460 210,464 212,458 207,454 213,454" transform="scale(0.8) translate(50, 80)"/>
    <polygon points="285,448 287,454 293,454 288,458 290,464 285,460 280,464 282,458 277,454 283,454" transform="scale(0.8) translate(70, 80)"/>
  </g>
</svg>
