      background-repeat: no-repeat;

            indicators: [
              { id: 49, title: "مؤشر 49: وجود علاقات إنسانية إيجابية يسودها الاحترام بين المنسوبين.", description: "شيوع روح الفريق والتعاون والتوافق بين الإدارة والمعلمين والطلاب." },
              { id: 50, title: "مؤشر 50: تقديم برامج توجيه وإرشاد نفسي واجتماعي فاعلة وموثقة.", description: "تفعيل جلسات الإرشاد الفردي والجمعي وتقديم الرعاية النفسية للطلاب." },
              { id: 51, title: "مؤشر 51: وجود آليات واضحة وفعالة للتعامل مع المشكلات السلوكية.", description: "معالجة المخالفات السلوكية وفق قواعد قواعد السلوك والمواظبة المعتمدة." },
              { id: 52, title: "مؤشر 52: تقديم الدعم الأكاديمي والمهني للطلاب وتوجيههم للمستقبل.", description: "إعداد خطط توجيه مهني وأكاديمي لمساعدة الطلاب في اختيار مساراتهم." },
              { id: 53, title: "مؤشر 53: توفير بيئة صحية عبر المقصف المدرسي وبرامج التوعية.", description: "رقابة الاشتراطات الصحية في المقصف وتنظيم محاضرات التوعية الصحية." },
              { id: 54, title: "مؤشر 54: تنفيذ برامج تعزز الانتماء والولاء للمدرسة والوطن.", description: "إقامة الاحتفالات باليوم الوطني والأيام العالمية وترسيخ قيم الولاء." }
            ]
          }
        ]
      }
    ];

    let selectedIndicatorId = 1;
    let evidences = JSON.parse(localStorage.getItem('school_excellence_evidences') || '{}');

    function updateStats() {
      const completedCount = Object.values(evidences).filter(e => e && e.isCompleted).length;
      document.getElementById('stat-completed').innerText = completedCount;
      const pct = Math.round((completedCount / 54) * 100);
      document.getElementById('progress-bar').style.width = pct + '%';
    }

    function renderSidebar() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const container = document.getElementById('accordion-container');
      container.innerHTML = '';

      excellenceData.forEach(domain => {
        const domainEl = document.createElement('div');
        domainEl.className = 'border border-[#63B2C6]/30 rounded-2xl overflow-hidden bg-white/60 mb-2';
        
        let domainContent = `
          <button onclick="this.nextElementSibling.classList.toggle('hidden')" class="w-full flex items-center justify-between p-3.5 bg-[#63B2C6]/10 hover:bg-[#63B2C6]/20 text-right transition border-b border-[#63B2C6]/20">
            <span class="text-xs font-bold text-[#4A93A6]">${domain.title}</span>
            <i class="fa-solid fa-chevron-down text-[#4A93A6] text-xs"></i>
          </button>
          <div class="p-2 space-y-2 bg-white/40">
        `;

        domain.criteria.forEach(crit => {
          domainContent += `
            <div class="border border-slate-200 rounded-xl overflow-hidden bg-white">
              <button onclick="this.nextElementSibling.classList.toggle('hidden')" class="w-full flex items-center justify-between p-2.5 text-right text-xs font-semibold text-slate-700">
                <span>${crit.title}</span>
                <i class="fa-solid fa-chevron-left text-slate-400 text-[10px]"></i>
              </button>
              <div class="pr-3 pl-1 py-1 space-y-1 bg-slate-50 border-t border-slate-100">
          `;

          crit.indicators.forEach(ind => {
            if (query && !ind.title.toLowerCase().includes(query)) return;
            const isDone = evidences[ind.id]?.isCompleted;
            const isSel = selectedIndicatorId === ind.id;
            
            domainContent += `
              <button onclick="selectIndicator(${ind.id})" class="w-full text-right p-2.5 rounded-xl text-xs flex items-center justify-between transition ${isSel ? 'bg-[#63B2C6]/20 text-[#4A93A6] font-bold border border-[#63B2C6]/40' : 'hover:bg-slate-100 text-slate-700'}">
                <span class="truncate pl-2">${ind.title}</span>
                ${isDone ? '<i class="fa-solid fa-circle-check text-[#9ABF78]"></i>' : '<i class="fa-regular fa-clock text-slate-400"></i>'}
              </button>
            `;
          });

          domainContent += `</div></div>`;
        });

        domainContent += `</div>`;
        domainEl.innerHTML = domainContent;
        container.appendChild(domainEl);
      });
    }

    function selectIndicator(id) {
      selectedIndicatorId = id;
      renderSidebar();
      renderMain();
    }

    function findIndicator(id) {
      for (const dom of excellenceData) {
        for (const crit of dom.criteria) {
          for (const ind of crit.indicators) {
            if (ind.id === id) return { dom, crit, ind };
          }
        }
      }
      return null;
    }

    function renderMain() {
      const ctx = findIndicator(selectedIndicatorId);
      const main = document.getElementById('main-content');
      if (!ctx) return;

      const ev = evidences[selectedIndicatorId] || {};

      main.innerHTML = `
        <div class="border-b border-slate-200 pb-4 space-y-3">
          <div class="flex items-center gap-2 text-xs text-[#4A93A6] font-bold">
            <span class="bg-[#63B2C6]/15 px-2.5 py-1 rounded-xl border border-[#63B2C6]/30">${ctx.dom.title}</span>
            <span>/</span>
            <span class="text-slate-500">${ctx.crit.title}</span>
          </div>
          <h2 class="text-xl font-bold text-[#4A93A6] flex items-center gap-2">
            <span>${ctx.ind.title}</span>
          </h2>
          <div class="bg-white p-4 rounded-xl border border-[#63B2C6]/20">
            <p class="text-sm text-slate-700 leading-relaxed">${ctx.ind.description}</p>
          </div>
        </div>

        <form onsubmit="saveForm(event)" class="space-y-5 flex-1 flex flex-col">
          <div class="space-y-1.5">
            <label class="block text-xs font-bold text-slate-700">وصف الإنجاز والشواهد المرفقة *</label>
            <textarea id="desc" rows="4" required class="w-full bg-white border border-[#63B2C6]/40 rounded-2xl p-3.5 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-[#63B2C6]">${ev.description || ''}</textarea>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="space-y-1.5">
              <label class="block text-xs font-bold text-slate-700">الفئة المستهدفة / الجهة</label>
              <input id="target" type="text" value="${ev.targetGroup || ''}" placeholder="مثال: المعلمون والطلاب" class="w-full bg-white border border-[#63B2C6]/40 rounded-2xl px-4 py-3 text-sm text-slate-800" />
            </div>
            <div class="space-y-1.5">
              <label class="block text-xs font-bold text-slate-700">رابط خارجي (Google Drive / Cloud)</label>
              <input id="link" type="url" value="${ev.linkUrl || ''}" placeholder="https://..." class="w-full bg-white border border-[#63B2C6]/40 rounded-2xl px-4 py-3 text-sm text-slate-800 ltr text-left" />
            </div>
          </div>

          <div class="pt-4 mt-auto flex justify-between">
            <button type="submit" class="px-8 py-3 rounded-2xl bg-gradient-to-tr from-[#63B2C6] to-[#4A93A6] text-white font-bold text-sm shadow-md hover:translate-y-[-2px] transition">
              <i class="fa-solid fa-floppy-disk ml-1.5"></i> حفظ ومصادقة الشاهد
            </button>
          </div>
        </form>
      `;
    }

    function saveForm(e) {
      e.preventDefault();
      const desc = document.getElementById('desc').value;
      const target = document.getElementById('target').value;
      const link = document.getElementById('link').value;

      evidences[selectedIndicatorId] = {
        description: desc,
        targetGroup: target,
        linkUrl: link,
        isCompleted: true,
        updatedAt: new Date().toISOString()
      };

      localStorage.setItem('school_excellence_evidences', JSON.stringify(evidences));
      updateStats();
      renderSidebar();
      alert('تم حفظ ومصادقة الشاهد بنجاح!');
    }

    document.getElementById('search-input').addEventListener('input', renderSidebar);

    updateStats();
    renderSidebar();
    renderMain();
  </script>
</body>
</html>
